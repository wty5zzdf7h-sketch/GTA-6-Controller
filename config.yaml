# Konfiguration des Restock-Wächters für den DualSense „Grand Theft Auto VI“ Limited Edition.
#
# Typen:
#   product – Produktseite; meldet, wenn sie von „nicht lieferbar“ auf „lieferbar“ wechselt.
#   search  – Shop-Suche; meldet, wenn der Controller in den Suchergebnissen auftaucht.
#   feed    – RSS/Atom-Feed; meldet neue Beiträge, die zu match_patterns passen.
#
# Ein Eintrag lässt sich mit `enabled: false` abschalten.

settings:
  ntfy_server: https://ntfy.sh
  timezone: Europe/Zurich
  # Einmal täglich ab dieser Stunde ein kurzer „läuft noch“-Status (leise). Entfernen = aus.
  daily_summary_hour: 9
  # Nach so vielen fehlgeschlagenen Läufen in Folge kommt eine Warnung (18 × 10 Min = 3 h).
  failure_alert_after: 18

# Erkennung des Produkts in Suchergebnissen und Feeds (Kleinschreibung, Regex).
# Bewusst „auto vi“ statt nur „gta“, damit das Echo des Suchbegriffs nicht als Treffer zählt.
match_patterns:
  - 'dualsense.{0,120}(grand theft auto vi|gta vi\b|gta 6)'
  - '(grand theft auto vi|gta vi\b|gta 6).{0,120}(dualsense|controller|manette)'


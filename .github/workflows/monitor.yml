name: GTA VI Controller Wächter 

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet teils etwas verspätet)
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Nur eine Testnachricht senden"
        type: boolean
        default: false

permissions:
  contents: write   # nur für den Keepalive-Commit

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zustand laden
        uses: actions/cache/restore@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Testnachricht
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py --test

      - name: Prüfen
        if: ${{ !inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Zustand speichern
        if: ${{ always() && !inputs.test_notification }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}

      # GitHub pausiert Zeitpläne nach 60 Tagen ohne Commit – alle ~50 Tage ein Mini-Commit.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt $(( 50 * 86400 )) ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive"
            git push
          fi

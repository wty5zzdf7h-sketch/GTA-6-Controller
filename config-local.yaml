# Lokale Konfiguration fürs Windows-Notebook (Aufruf: python monitor.py --config config-local.yaml).
# Enthält nur die Quellen, die in config.yaml wegen Sperren gegen GitHub-Server abgeschaltet sind.
# Format wie config.yaml. Stand der Prüfung: 23.11.2026, normale Abfrage ohne Umgehung von Bot-Schutz.

settings:
  ntfy_server: https://ntfy.sh
  timezone: Europe/Zurich
  # Eigener Zustand, damit er sich nicht mit dem GitHub-Lauf vermischt
  state_file: state/state-local.json
  log_file: state/monitor-local.log
  daily_summary_hour: 9
  failure_alert_after: 18

match_patterns:
  - 'dualsense.{0,120}(grand theft auto vi|gta vi\b|gta 6)'
  - '(grand theft auto vi|gta vi\b|gta 6).{0,120}(dualsense|controller|manette)'

targets:
  # ---------------- funktioniert vom Notebook ----------------
  - id: mediamarkt-ch-white
    name: MediaMarkt CH
    variant: Weiss
    type: product
    url: https://www.mediamarkt.ch/fr/product/_sony-ps-playstation-dualsenser-grand-theft-auto-vi-white-limited-edition-wireless-controller-weissblauviolett-fur-playstation-5-pc-mac-android-ios-2295724.html

  - id: gameshop-at-white
    name: gameshop.at
    variant: Weiss
    type: product
    url: https://www.gameshop.at/DualSense_Wireless_Controller_PS5_19818.html
    # schema.org meldet immer „InStock“; massgeblich ist das Bild auf dem Bestell-Button
    # (webpics/ausverkauft_v3.png). „vorbestellen“ steht zudem im Menü, daher eigene Muster.
    sold_out_patterns:
      - 'class="btn_warenkorb_detail"[^>]*ausverkauft'
    in_stock_patterns:
      - 'class="btn_warenkorb_detail"(?![^>]*ausverkauft)'

  # Das Produkt steht schon in der Suche (nur nicht lieferbar) – die Suche würde sofort
  # „aufgetaucht“ melden. Die Produktseite oben deckt MediaMarkt CH bereits ab.
  - id: mediamarkt-ch-search
    enabled: false
    name: MediaMarkt CH Suche
    type: search
    url: https://www.mediamarkt.ch/de/search.html?query=dualsense%20grand%20theft%20auto

  # ---------------- blockiert auch vom Notebook (Test 23.11.2026) ----------------
  - id: galaxus-ch-white
    enabled: false   # HTTP 403 „Access denied“
    name: Galaxus CH
    variant: Weiss
    type: product
    url: https://www.galaxus.ch/de/s1/product/76618335

  - id: digitec-ch-white
    enabled: false   # HTTP 403 „Access denied“
    name: Digitec
    variant: Weiss
    type: product
    url: https://www.digitec.ch/de/s1/product/76618335

  - id: galaxus-ch-search
    enabled: false   # HTTP 403 „Access denied“
    name: Galaxus CH Suche
    type: search
    url: https://www.galaxus.ch/de/search?q=dualsense%20grand%20theft%20auto

  - id: brack-search
    enabled: false   # keine Antwort (Timeout nach 45 s)
    timeout: 45
    name: Brack Suche
    type: search
    url: https://www.brack.ch/search?query=dualsense+grand+theft+auto

  - id: interdiscount-search
    enabled: false   # HTTP 403, Captcha-Seite (DataDome)
    name: Interdiscount Suche
    type: search
    url: https://www.interdiscount.ch/de/search?search=dualsense%20grand%20theft%20auto

  - id: microspot-search
    enabled: false   # leitet auf Interdiscount um -> HTTP 403, Captcha-Seite
    name: Microspot Suche
    type: search
    url: https://www.microspot.ch/de/search?search=dualsense%20grand%20theft%20auto

  - id: fust-search
    enabled: false   # HTTP 403, Captcha-Seite (DataDome)
    name: Fust Suche
    type: search
    url: https://www.fust.ch/de/search.html?query=dualsense+grand+theft+auto
